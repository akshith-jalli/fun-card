<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Will You Be My Valentine? ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 500px;
            position: relative;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 20px;
        }

        .question {
            font-size: 26px;   /* Bigger text */
            font-weight: bold; /* Optional: make it stronger */
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .yes {
            background-color: #e91e63;
            color: white;
            /* position: absolute; */
        }

        .no {
            background-color: #ccc;
            /* position: absolute; */
        }
        button:hover {
            transform: scale(1.1);
        }

        .hidden {
            display: none;
        }

        .final-message {
            font-size: 22px;
            color: #e91e63;
            margin-top: 20px;
        }

        /* Photo container */
        .photo-container {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .photo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #e91e63;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .photo:hover {
            transform: scale(1.1);
        }

    </style>
</head>
<body>

<div class="card" id="card">
    <h1 id="header">Hey Gendekay Chinnam !!! ❤️</h1>
    <div class="photo-container" id="photos">
        <img src="1.jpg" alt="Me" class="photo">
        <img src="2.jpg" alt="My Valentine" class="photo">
    </div>
    <div id="content">
        <div class="question" id="question"> Assalu Gurthunnanaa ?</div>
        <button class="yes" id="yesbtn" onclick="handleYesButton()">YES 💖</button>
        <button class="no" id ="nobtn" onclick="nextQuestion1n()">NO 😠</button>
    </div>
    <div id="valentine-question" class="hidden">
        <div class="question" id="counttext"> How many Valentine's Days have we celebrated? ❤️</div>
        <input type="number" id="valentine-count" min="0" placeholder="Enter number" style="font-size:18px; padding:6px; border-radius:5px; border:1px solid #ccc;">
        <button class="yes" onclick="submitValentineCount()">Submit 💖</button>
        <button class="yes" style="display:none;" id="nextbtn" onclick="openquestion2()">Waakey</button>
    </div>
</div>




<script>

    const questionElement = document.getElementById("question");
    const photoContainer = document.getElementById("photos");
    const noBtn = document.getElementById("nobtn");
    const yesBtn = document.getElementById("yesbtn");
    const card = document.getElementById("card");

    let runHandler;  // store reference globally
    let yesClickCount = 0;  // global counter


    function make_button_run_away(btn){

        runHandler = function() {

            btn.style.position = "absolute";

            const maxX = card.clientWidth - btn.offsetWidth - 20;
            const maxY = card.clientHeight - btn.offsetHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            btn.style.left = randomX + "px";
            btn.style.top = randomY + "px";
        };

        btn.addEventListener("mouseover", runHandler);
    }

    function stop_button_and_center(btn){

        // Remove the event listener
        btn.removeEventListener("mouseover", runHandler);

        // Reset positioning
        btn.style.position = "static";
        btn.style.left = "";
        btn.style.top = "";

        // Optional: center both buttons nicely
        btn.style.display = "inline-block";
    }

    make_button_run_away(yesBtn)

    function showValentineCountQuestion() {
        // Hide the previous question/content
        document.getElementById("content").style.display = "none";

        // Show the new Valentine count question
        document.getElementById("valentine-question").classList.remove("hidden");
    }

    function submitValentineCount() {
        const count = document.getElementById("valentine-count").value;

        if(count === "" || count < 0) {
            alert("Please enter a valid number 😌");
            return;
        }

        if (count == 0) {
            document.getElementById("counttext").innerHTML = "Correct 😌 \n!! Atleast next time aina let's celebrate together"
        } else {
            document.getElementById("counttext").innerHTML = "Wrong!! We celebrates 0 valentine days together 😌 \n!! Atleast next time aina let's celebrate together"
        }

        document.getElementById("nextbtn").style.display = "inline-block"

    }

    function openquestion2(){
        document.getElementById("valentine-question").style.display = "none"

        document.getElementById("content").style.display = "inline-block"

        questionElement.innerHTML = "Kopam gaa unnavaa ?"
    }

    function handleYesButton() {
        yesClickCount++;  // increment click count

        if(yesClickCount === 1) {
            // First click → call function1
            questionElement.innerText = "Bathikinchaav !! Inthaki idhi manaki enno valentines day ?? "
            showValentineCountQuestion();
        } else if(yesClickCount === 2) {
            // Second click → call function2
            questionElement.innerText = "Naaku thelusey !!! I'm so so sorry ... \n Sorry Accepted ? "
        }
        else if(yesClickCount === 3) {
            // Second click → call function2
            questionElement.innerText = "Do you still love me ?"
        }
        else if(yesClickCount === 4) {
            // Second click → call function2
            questionElement.innerText = "Be on my side forever Chinnam.. \nilaney 3 godavalu 6 alakalu gaa life antha undham !! \n Untavaa life long naatho ?"
        } else if(yesClickCount ===5) {
            window.open("https://digibouquet.vercel.app/bouquet/e168a428-8081-473a-a16d-06133aa2a605", "_blank");
            // Second click → call function2
            // questionElement.innerText = "Be on my side forever Chinnam.. \nilaney 3 godavalu 6 alakalu gaa life antha undham !! \n Untavaa life long naatho ?"
        }
    }

    //             "<div class='final-message'>YAY!!! I can't wait to spend Valentine's Day with you ❤️🥰</div>";
    //     }
    // }


    function nextQuestion1n() {
        document.getElementById("header").style.display = "none"
        questionElement.innerText = "Durmarkuraalaa !!! Ippudu Gurthochanaa ?? "
        photoContainer.style.display = "flex";
        noBtn.style.display = "none"
        stop_button_and_center(yesBtn)
    }

</script>
